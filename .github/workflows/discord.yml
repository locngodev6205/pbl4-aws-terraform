name: GitHub to Discord - ProJS

on:
  push:
  pull_request:
  issues:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send rich Discord embed
        uses: actions/github-script@v7
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          script: |
            const webhook = process.env.WEBHOOK;
            if (!webhook) {
              core.setFailed('Missing DISCORD_WEBHOOK secret');
              return;
            }

            const ev = context.eventName;
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const actor = context.actor;
            const avatar = context.payload?.sender?.avatar_url ?? undefined;
            const ts = new Date().toISOString();

            let embed = {
              color: 5814783,
              author: { name: actor, icon_url: avatar },
              footer: { text: repo },
              timestamp: ts
            };

            if (ev === 'push') {
              const ref = context.ref.replace('refs/heads/', '');
              const compare = context.payload.compare;
              const commits = (context.payload.commits || []).slice(0, 5);
              const lines = commits.length
                ? commits.map(c =>
                    `- [\`${c.id.slice(0,7)}\`](${c.url}) by **${(c.author?.username || c.author?.name || 'unknown')}**: ${String(c.message||'').split('\n')[0]} (+${(c.added||[]).length} -${(c.removed||[]).length} ~${(c.modified||[]).length})`
                  ).join('\n')
                : '(no commit details)';

              embed.title = `🚀 Push to \`${ref}\` — ${repo}`;
              embed.description = `**Pusher:** ${actor}\n**Compare:** ${compare}\n\n${lines}`;
              embed.url = compare;
              embed.color = 5814783;

            } else if (ev === 'pull_request') {
              const pr = context.payload.pull_request;
              const from = pr.head.ref;
              const to = pr.base.ref;
              const add = pr.additions ?? 0;
              const del = pr.deletions ?? 0;
              const chg = pr.changed_files ?? 0;

              embed.title = `🔀 PR #${pr.number} ${String(pr.state).toUpperCase()} — ${pr.title}`;
              embed.description = `**Action:** ${context.payload.action} by **${actor}** (author: **${pr.user.login}**)\n**Branch:** \`${from}\` → \`${to}\`\n**Diff:** +${add} -${del} (${chg} files)\n**Link:** ${pr.html_url}`;
              embed.url = pr.html_url;
              embed.color = 3447003;

            } else if (ev === 'issues') {
              const is = context.payload.issue;

              embed.title = `📌 Issue #${is.number} ${String(is.state).toUpperCase()} — ${is.title}`;
              embed.description = `**Action:** ${context.payload.action} by **${actor}** (author: **${is.user.login}**)\n**Link:** ${is.html_url}`;
              embed.url = is.html_url;
              embed.color = 15105570;

            } else {
              embed.title = `ℹ️ ${ev} — ${repo}`;
              embed.description = `Actor: **${actor}**`;
              embed.color = 9807270;
            }

            const payload = { embeds: [embed] };
            const res = await fetch(webhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (!res.ok) {
              core.setFailed(`Discord webhook failed: ${res.status} ${res.statusText}`);
            }
