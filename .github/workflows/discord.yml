name: GitHub → Discord (Pro)

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  push:
    branches: [main]
  issues:
    types: [opened, reopened, closed]

permissions:
  contents: read

# Tránh spam nếu có nhiều run song song
concurrency:
  group: discord-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify:
    # Né case push đầu tiên của repo/branch (before = 0000… hoặc event.created)
    if: ${{ github.event_name != 'push' || (github.event.before != '0000000000000000000000000000000000000000' && !github.event.created) }}
    runs-on: ubuntu-latest
    steps:
      - name: Send rich Discord embed
        uses: actions/github-script@v7
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          script: |
            // context, core, github, fetch có sẵn trong github-script
            const webhook = process.env.WEBHOOK;
            if (!webhook) {
              core.setFailed('Missing DISCORD_WEBHOOK secret');
              return;
            }

            // helpers
            const repoFull = `${context.repo.owner}/${context.repo.repo}`;
            const actor = context.actor;
            const avatar = context.payload?.sender?.avatar_url;
            const nowISO = new Date().toISOString();
            const trim = (s, n) => (s || '').length > n ? s.slice(0, n - 1) + '…' : (s || '');

            const COLORS = {
              push: 5814783,              // blue
              prOpen: 3447003,            // green
              prMerged: 10181046,         // purple
              prClosed: 15158332,         // red
              issue: 15105570,            // orange
              info: 9807270               // grey
            };

            const baseEmbed = (color) => ({
              color,
              author: { name: actor, icon_url: avatar },
              footer: { text: repoFull },
              timestamp: nowISO
            });

            const send = async (embed) => {
              const res = await fetch(webhook, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ embeds: [embed] })
              });
              if (!res.ok) {
                const text = await res.text();
                core.setFailed(`Discord webhook failed: ${res.status} ${res.statusText} — ${text}`);
              }
            };

            // ===== PUSH → chỉ nhánh main =====
            if (context.eventName === 'push') {
              const ref = context.ref.replace('refs/heads/', '');
              const before = context.payload.before;
              const after  = context.payload.after;

              let compareUrl = `${context.payload.repository?.html_url}/compare/${before.slice(0,7)}...${after.slice(0,7)}`;
              let addedFiles = 0, removedFiles = 0, modifiedFiles = 0;
              let linesAdded = 0, linesDeleted = 0;
              let commitLines = '(no commit details)';

              try {
                const cmp = await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  base:  before,
                  head:  after
                });

                for (const f of (cmp.data.files || [])) {
                  const st = f.status; // added | removed | modified | renamed | changed
                  if (st === 'added') addedFiles++;
                  else if (st === 'removed') removedFiles++;
                  else modifiedFiles++; // tính renamed/changed là modified
                  linesAdded  += f.additions  || 0;
                  linesDeleted += f.deletions  || 0;
                }

                const commits = (cmp.data.commits || []).slice(-5);
                if (commits.length) {
                  commitLines = commits.map(c => {
                    const sha = c.sha.slice(0,7);
                    const who = c.author?.login || c.commit?.author?.name || 'unknown';
                    const msg = trim(String(c.commit?.message || '').split('\n')[0], 140);
                    return `- [\`${sha}\`](${c.html_url}) by **${who}**: ${msg}`;
                  }).join('\n');
                }

                compareUrl = cmp.data.html_url || compareUrl;
              } catch (e) {
                // Fallback: vẫn gửi thông báo tối thiểu
                console.log('compareCommits failed, fallback message. Reason:', e.message);
              }

              const embed = {
                ...baseEmbed(COLORS.push),
                title: `🚀 Push to \`${ref}\` — ${repoFull}`,
                url: compareUrl,
                description: [
                  `**Pusher:** ${actor}`,
                  `**Compare:** ${compareUrl}`,
                  ``,
                  `**Files changed:** ${addedFiles} added, ${removedFiles} removed, ${modifiedFiles} modified`,
                  `**Lines:** +${linesAdded} / -${linesDeleted}`,
                  ``,
                  commitLines
                ].join('\n')
              };

              await send(embed);
              return;
            }

            // ===== PULL REQUEST =====
            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              const from = pr.head.ref;
              const to = pr.base.ref;

              let color = COLORS.prOpen;
              if (pr.merged) color = COLORS.prMerged;
              else if (pr.state === 'closed') color = COLORS.prClosed;

              const embed = {
                ...baseEmbed(color),
                title: `🔀 PR #${pr.number} ${String(pr.merged ? 'MERGED' : pr.state).toUpperCase()} — ${trim(pr.title, 200)}`,
                url: pr.html_url,
                description: [
                  `**Action:** ${context.payload.action} by **${actor}** (author: **${pr.user.login}**)`,
                  `**Branch:** \`${from}\` → \`${to}\``,
                  `**Files changed:** ${pr.changed_files} files`,
                  `**Lines:** +${pr.additions} / -${pr.deletions}`,
                  `**Link:** ${pr.html_url}`
                ].join('\n')
              };

              await send(embed);
              return;
            }

            // ===== ISSUES =====
            if (context.eventName === 'issues') {
              const is = context.payload.issue;

              const embed = {
                ...baseEmbed(COLORS.issue),
                title: `📌 Issue #${is.number} ${String(is.state).toUpperCase()} — ${trim(is.title, 200)}`,
                url: is.html_url,
                description: [
                  `**Action:** ${context.payload.action} by **${actor}** (author: **${is.user.login}**)`,
                  `**Link:** ${is.html_url}`
                ].join('\n')
              };

              await send(embed);
              return;
            }

            // ===== OTHER EVENTS (fallback) =====
            const embed = {
              ...baseEmbed(COLORS.info),
              title: `ℹ️ ${context.eventName} — ${repoFull}`,
              description: `Actor: **${actor}**`
            };
            await send(embed);
